# This workflow runs the tests, builds Torchflows, publishes it to PyPI and attaches the distributions to a GitHub release.
# For more information see: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
#
# The version is computed here, so commits do not need to be tagged:
# by default, the patch number of the latest version on PyPI is bumped (e.g. 1.2.0 -> 1.2.1).
# When running the workflow manually, a minor/major bump or an exact version can be chosen instead.
# The GitHub release creates the corresponding v* tag.

name: Build Torchflows and upload to PyPI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the latest PyPI version to bump
        type: choice
        options: [ patch, minor, major ]
        default: patch
      version:
        description: Exact version to publish (e.g. 1.3.0). Overrides the bump if set.
        type: string
        required: false

# Releases run one at a time, so two runs cannot compute the same version
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/run-tests.yml

  build:
    name: Build Torchflows
    needs:
    - tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Determine version
      id: version
      env:
        BUMP: ${{ inputs.bump }}
        VERSION: ${{ inputs.version }}
      run: |
        python3 - <<'EOF'
        import json
        import os
        import re
        import urllib.request

        with urllib.request.urlopen("https://pypi.org/pypi/torchflows/json") as response:
            pypi = json.load(response)
        latest = pypi["info"]["version"]

        version = os.environ.get("VERSION", "").strip().removeprefix("v")
        if version:
            if not re.fullmatch(r"\d+\.\d+\.\d+((a|b|rc)\d+)?", version):
                raise SystemExit(f"::error::Invalid version '{version}', expected e.g. 1.3.0 or 1.3.0rc1")
        else:
            major, minor, patch = (int(part) for part in re.match(r"(\d+)\.(\d+)\.(\d+)", latest).groups())
            bump = os.environ.get("BUMP") or "patch"
            if bump == "major":
                version = f"{major + 1}.0.0"
            elif bump == "minor":
                version = f"{major}.{minor + 1}.0"
            else:
                version = f"{major}.{minor}.{patch + 1}"

        if version in pypi["releases"]:
            raise SystemExit(f"::error::Version {version} is already on PyPI")

        print(f"Latest version on PyPI: {latest}, publishing: {version}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as output:
            output.write(f"version={version}\n")
        EOF
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build binary wheel and source tarball
      env:
        # Tells setuptools-scm which version to use instead of reading it from git tags
        SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
      run: python3 -m build
    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Torchflows distribution to PyPI
    # Pull requests only check that the package builds
    if: github.event_name != 'pull_request'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchflows
    permissions:
      id-token: write
    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload to GitHub release
    needs:
    - build
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Create GitHub release
      run: >-
        gh release create "$TAG"
        --repo '${{ github.repository }}'
        --target '${{ github.sha }}'
        --title "$TAG"
        --generate-notes
    - name: Upload distributions to GitHub release
      run: >-
        gh release upload "$TAG" dist/*
        --repo '${{ github.repository }}'
