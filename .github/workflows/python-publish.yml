# This workflow runs the tests, builds Torchflows, publishes it to PyPI and attaches the distributions to a GitHub release.
# For more information see: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: Build Torchflows and upload to PyPI

on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/run-tests.yml

  build:
    name: Build Torchflows
    needs:
    - tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - uses: actions/checkout@v4
      with:
        # setuptools-scm needs the full history and tags to determine the version
        fetch-depth: 0
    - name: Check that the commit has a version tag
      id: tag
      if: github.event_name != 'pull_request'
      run: |
        tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1)
        if [ -z "$tag" ]; then
          echo "::error::Commit ${{ github.sha }} has no version tag. Tag it (e.g. git tag v1.3.0) and push the tag together with the branch: git push --atomic origin release v1.3.0"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build binary wheel and source tarball
      run: python3 -m build
    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Torchflows distribution to PyPI
    # Pull request builds are untagged dev versions, which PyPI rejects
    if: github.event_name != 'pull_request'
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torchflows
    permissions:
      id-token: write
    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Upload to GitHub release
    needs:
    - build
    - publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
    - name: Download all the distributions
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Create GitHub release
      run: >-
        gh release create "$TAG"
        --repo '${{ github.repository }}'
        --title "$TAG"
        --generate-notes
    - name: Upload distributions to GitHub release
      run: >-
        gh release upload "$TAG" dist/*
        --repo '${{ github.repository }}'
