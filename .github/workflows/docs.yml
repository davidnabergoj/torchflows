# Builds the Sphinx documentation and runs all code examples in the docs, README and examples.
# Read the Docs deploys the documentation; this workflow only checks that it builds and matches the code.

name: Build docs

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    name: Build docs and run examples
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm needs tags to determine the docs version
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r docs/requirements.txt
        python -m pip install matplotlib  # used in examples
        python -m pip install .
    - name: Build HTML (warnings are errors)
      run: python -m sphinx -W --keep-going -b html docs/source docs/build/html
    - name: Run code examples
      env:
        OMP_NUM_THREADS: 1
        MKL_NUM_THREADS: 1
      run: python docs/check_snippets.py
