version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # setuptools-scm needs tags to determine the package version
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/source/conf.py

python:
  install:
  - requirements: docs/requirements.txt
  - method: pip
    path: .
