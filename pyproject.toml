[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torchflows"
dynamic = ["version"]
authors = [
    { name = "David Nabergoj", email = "david.nabergoj@fri.uni-lj.si" },
]
description = "Normalizing flows in PyTorch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = [
    "python",
    "machine-learning",
    "pytorch",
    "generative-model",
    "sampling",
    "density-estimation",
    "normalizing-flow",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    'torch>=2.0.1',
    'numpy',
    'torchdiffeq>=0.2.3',
    'tqdm>=4.65.0',
    "pytest>=8.4.2",
]

[project.urls]
Homepage = "https://github.com/davidnabergoj/torchflows"
Issues = "https://github.com/davidnabergoj/torchflows/issues"

[tool.setuptools.dynamic]
version = { attr = "torchflows._version.__version__" }

[tool.setuptools.packages.find]
include = ["torchflows*"]
